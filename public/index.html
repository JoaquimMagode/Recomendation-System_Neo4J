<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Finder · Recommendations</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Hero header -->
  <header class="hero text-center text-white py-5">
    <div class="container">
      <h1 class="display-5 fw-bold mb-2">
        <i class="bi bi-geo-alt-fill"></i> Place Finder
      </h1>
      <p class="lead mb-0">Tell us what you like and we'll recommend places for you.</p>
    </div>
  </header>

  <main class="container my-4">
    <div class="row g-4">
      <!-- Preferences form -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title mb-3">
              <i class="bi bi-sliders"></i> Your preferences
            </h5>

            <form id="prefForm">
              <div class="mb-3">
                <label for="city" class="form-label">City</label>
                <select id="city" class="form-select">
                  <option value="">Any city</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" class="form-select">
                  <option value="">Any category</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="maxPrice" class="form-label">
                  Max price: <span id="priceLabel" class="fw-semibold">Any</span>
                </label>
                <input
                  type="range"
                  class="form-range"
                  id="maxPrice"
                  min="0"
                  max="3"
                  step="1"
                  value="3"
                />
                <div class="d-flex justify-content-between small text-muted">
                  <span>Free</span><span>$</span><span>$$</span><span>$$$</span>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">What are you into?</label>
                <div id="tagContainer" class="d-flex flex-wrap gap-2">
                  <!-- tag chips injected here -->
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-search"></i> Recommend places
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="col-lg-8">
        <div id="statusArea"></div>
        <div id="results" class="row g-3"></div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-4 small">
    Built with Node.js, Express &amp; Neo4j
  </footer>

  <script src="app.js"></script>
</body>
</html>
